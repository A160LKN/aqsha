name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GO_VERSION: "1.24"

jobs:
  contracts:
    name: Контракты protobuf, форматирование, vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: buf lint и format
        run: buf lint && buf format --diff --exit-code
      - name: Обратная совместимость контрактов (buf breaking)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            buf breaking --against ".git#branch=origin/${{ github.base_ref }}"
          elif git rev-parse HEAD~1 >/dev/null 2>&1 && git ls-tree -d HEAD~1 proto >/dev/null 2>&1 && [ -n "$(git ls-tree HEAD~1 proto)" ]; then
            buf breaking --against ".git#ref=HEAD~1"
          else
            echo "Первый коммит с контрактами — сравнивать не с чем"
          fi
      - name: Сгенерированный код совпадает с .proto
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          buf generate
          git diff --exit-code gen/ || { echo "::error::Обновите сгенерированный код: buf generate"; exit 1; }
      - name: gofmt и go vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::Запустите gofmt -w ."; exit 1; }
          go vet ./... && go vet -tags e2e ./e2e

  tests:
    name: Юнит, интеграционные и системные тесты
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: aqsha
          POSTGRES_PASSWORD: aqsha
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aqsha" --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://aqsha:aqsha@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Тесты с race-детектором и порогом покрытия
        run: ./scripts/coverage.sh
      - name: Отчёт о покрытии
        if: always()
        run: go tool cover -html=coverage.out -o coverage.html || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage.html
          retention-days: 14

  e2e:
    name: E2E, хаос-тест и нагрузка в Docker Compose
    needs: [contracts, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Поднять PostgreSQL, Kafka и оба сервиса
        run: docker compose up --build --detach --wait
      - name: E2E и хаос-тест (остановка сервиса счетов посреди переводов)
        env:
          STOP_LEDGER_CMD: docker compose stop ledger
          START_LEDGER_CMD: docker compose start ledger && docker compose up --wait ledger
        run: go test -tags e2e -count=1 -v ./e2e
      - uses: grafana/setup-k6-action@v1
      - name: Нагрузка по gRPC — пороги по времени ответа и проверка, что деньги сошлись
        working-directory: load
        run: k6 run --summary-export=summary.json transfers.js
      - name: Логи при падении
        if: failure()
        run: docker compose logs --no-color ledger payments kafka | tail -n 400

  kubernetes:
    name: Развёртывание в Kubernetes (kind) и E2E
    needs: [contracts, tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: aqsha
      - name: Собрать образ и загрузить в кластер
        run: |
          docker build -t aqsha:ci .
          kind load docker-image aqsha:ci --name aqsha
      - name: Развернуть
        run: |
          kubectl apply -k deploy/k8s
          for d in postgres kafka ledger payments; do
            kubectl -n aqsha rollout status deploy/$d --timeout=180s
          done
      - name: E2E против кластера (хаос — масштабирование сервиса счетов до нуля)
        env:
          LEDGER_ADDR: localhost:19091
          PAYMENTS_ADDR: localhost:19090
          STOP_LEDGER_CMD: kubectl -n aqsha scale deploy/ledger --replicas=0 && kubectl -n aqsha wait --for=delete pod -l app=ledger --timeout=60s
          START_LEDGER_CMD: >-
            kubectl -n aqsha scale deploy/ledger --replicas=1 && kubectl -n aqsha rollout status deploy/ledger --timeout=120s &&
            (pkill -f "port-forward sv[c]/ledger" || true) &&
            (kubectl -n aqsha port-forward svc/ledger 19091:9090 > /tmp/pf-ledger.log 2>&1 &) && sleep 3
        run: |
          kubectl -n aqsha port-forward svc/payments 19090:9090 > /tmp/pf-payments.log 2>&1 &
          kubectl -n aqsha port-forward svc/ledger 19091:9090 > /tmp/pf-ledger.log 2>&1 &
          sleep 3
          go test -tags e2e -count=1 -v ./e2e
      - name: Состояние кластера и логи при падении
        if: failure()
        run: |
          kubectl -n aqsha get pods -o wide
          kubectl -n aqsha describe pods | tail -n 100
          kubectl -n aqsha logs deploy/ledger --tail=200 || true
          kubectl -n aqsha logs deploy/payments --tail=200 || true

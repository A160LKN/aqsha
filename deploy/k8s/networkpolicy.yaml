# Сеть по умолчанию закрыта: к базе, Kafka и сервису счетов ходят только свои.
# Ключ API защищает от чужих запросов, политика — от тех, кто вообще не должен видеть порт.
# Работает с CNI, которые поддерживают NetworkPolicy (Calico, Cilium); kindnet в CI их игнорирует.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-from-payments
spec:
  podSelector: { matchLabels: { app: ledger } }
  policyTypes: [Ingress]
  ingress:
    # gRPC — только сервису платежей
    - from: [{ podSelector: { matchLabels: { app: payments } } }]
      ports: [{ port: 9090 }]
    # Метрики — любому поду пространства имён (Prometheus)
    - from: [{ podSelector: {} }]
      ports: [{ port: 9100 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-services
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: ledger } }
        - podSelector: { matchLabels: { app: payments } }
      ports: [{ port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-from-services
spec:
  podSelector: { matchLabels: { app: kafka } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: ledger } }
        - podSelector: { matchLabels: { app: payments } }
        - podSelector: { matchLabels: { app: kafka } }

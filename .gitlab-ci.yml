# Тот же конвейер для GitLab CI: контракты, тесты на PostgreSQL, E2E в Docker Compose.
# Основной CI проекта — GitHub Actions (.github/workflows/ci.yml); этот файл — для зеркала на GitLab.
stages: [contracts, test, e2e]

variables:
  GO_IMAGE: golang:1.27

contracts:
  stage: contracts
  image: $GO_IMAGE
  script:
    - curl -sSL -o /usr/local/bin/buf https://github.com/bufbuild/buf/releases/download/v1.57.0/buf-Linux-x86_64 && chmod +x /usr/local/bin/buf
    - buf lint && buf format --diff --exit-code
    - git fetch origin "$CI_DEFAULT_BRANCH" && buf breaking --against ".git#branch=origin/$CI_DEFAULT_BRANCH" || [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]
    - test -z "$(gofmt -l .)"
    - go vet ./... && go vet -tags e2e ./e2e

tests:
  stage: test
  image: $GO_IMAGE
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    POSTGRES_USER: aqsha
    POSTGRES_PASSWORD: aqsha
    TEST_DATABASE_URL: postgres://aqsha:aqsha@postgres:5432/postgres?sslmode=disable
  script:
    - ./scripts/coverage.sh
    - go tool cover -html=coverage.out -o coverage.html
  coverage: '/Покрытие: (\d+\.\d+)%/'
  artifacts:
    when: always
    paths: [coverage.html]
    expire_in: 14 days

e2e:
  stage: e2e
  image: docker:28
  services: [docker:28-dind]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    LEDGER_ADDR: docker:9091
    PAYMENTS_ADDR: docker:9090
    STOP_LEDGER_CMD: docker compose stop ledger
    START_LEDGER_CMD: docker compose start ledger && docker compose up --wait ledger
  before_script:
    - apk add --no-cache go
  script:
    - docker compose up --build --detach --wait
    - go test -tags e2e -count=1 -v ./e2e
  after_script:
    - docker compose logs --no-color ledger payments | tail -n 300
